name: Blue-Green Deploy — ASP.NET Core on ECS

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub UI

  # Required for OIDC authentication to AWS
# permissions:
#   id-token: write   # allows GitHub to request OIDC token
#   contents: read    # allows checkout
env:
  AWS_REGION: us-east-1
  ECR_REPO: aspnetapp-production
  ECS_CLUSTER: blue-green-deployment-cluster
  SERVICE_BLUE: svc-blue
  SERVICE_GREEN: svc-green
  TASK_FAMILY_BLUE: aspnetapp-blue
  TASK_FAMILY_GREEN: aspnetapp-green
  CONTAINER_NAME: app-container
  HEALTH_PATH: /health

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Build and test the .NET application
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore MyApi/MyApi.csproj

      - name: Build
        run: |
          dotnet build MyApi/MyApi.csproj \
               --configuration Release \
               --no-restore

      - name: Test with coverage
        run: |
          dotnet test MyApi.Tests/MyApi.Tests.csproj \
            --configuration Release \
            --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() # upload even on test failure
        with:
          name: test-results
          path: coverage/

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Build Docker image and push to ECR
  # ─────────────────────────────────────────────────────────────
  docker-push:
    name: Docker Build & ECR Push
    runs-on: ubuntu-latest
    needs: build-and-test

    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-uri: ${{ steps.meta.outputs.image-uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tags
        id: meta
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGISTRY}/${REPOSITORY}:sha-${IMAGE_TAG}"

          echo "image-tag=sha-${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image-uri=${IMAGE_URI}"     >> $GITHUB_OUTPUT
          echo "registry=${REGISTRY}"       >> $GITHUB_OUTPUT

          echo "REGISTRY   : ${REGISTRY}"
          echo "REPOSITORY : ${REPOSITORY}"
          echo "IMAGE_TAG  : sha-${IMAGE_TAG}"
          echo "IMAGE_URI  : ${IMAGE_URI}"

      - name: Build, tag and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build with full SHA tag — exact pattern: sha-<40charSHA>
          docker build \
            -t $REGISTRY/$REPOSITORY:sha-$IMAGE_TAG \
            -f ./Dockerfile \
            .

          echo "=== Built images ==="
          docker images | grep $REPOSITORY

          # Push SHA tag
          echo "Pushing sha-${IMAGE_TAG}..."
          docker push $REGISTRY/$REPOSITORY:sha-$IMAGE_TAG

          echo "Both tags pushed"

      - name: Verify image in ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Verifying: sha-${IMAGE_TAG}"

          aws ecr describe-images \
            --repository-name ${{ env.ECR_REPO }} \
            --image-ids imageTag="sha-${IMAGE_TAG}" \
            --query 'imageDetails[0].{PushedAt:imagePushedAt,Tags:imageTags}' \
            --output table

          echo "SUCCESS"

      - name: Pull image from ECR
        run: docker pull "${{ steps.meta.outputs.image-uri }}"

      - name: Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image-uri }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Trivy gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image-uri }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          scanners: vuln
          trivyignores: .trivyignore

  # ─────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to idle slot (green) and validate health
  # ─────────────────────────────────────────────────────────────
  deploy-green:
    name: Deploy to Green
    runs-on: ubuntu-latest
    needs: docker-push

    outputs:
      deploy-slot: ${{ steps.slot.outputs.deploy-slot }}
      idle-slot: ${{ steps.slot.outputs.idle-slot }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect active slot
        id: slot
        run: |
          ACTIVE_TG=$(aws elbv2 describe-listeners \
            --listener-arns ${{ secrets.ALB_LISTENER_ARN }} \
            --query 'Listeners[0].DefaultActions[0].ForwardConfig.TargetGroups' \
            --output json \
          | jq -r '.[] | select(.Weight == 100) | .TargetGroupArn')

          if [[ "$ACTIVE_TG" == *"blue"* ]]; then
            echo "deploy-slot=green" >> $GITHUB_OUTPUT
            echo "idle-slot=blue"   >> $GITHUB_OUTPUT
          else
            echo "deploy-slot=blue" >> $GITHUB_OUTPUT
            echo "idle-slot=green"  >> $GITHUB_OUTPUT
          fi

          echo "Active TG: $ACTIVE_TG"
          echo "Deploying into: $(cat $GITHUB_OUTPUT | grep deploy-slot | cut -d= -f2)"

      - name: Register new task definition
        id: task-def
        run: |
          SLOT=${{ steps.slot.outputs.deploy-slot }}
          IMAGE_URI=${{ needs.docker-push.outputs.image-uri }}

          TASK_FAMILY="aspnetapp-${SLOT}"

          echo "Using task family: $TASK_FAMILY"

          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition \
            --output json > taskdef.json

          cat taskdef.json

          jq --arg IMAGE "$IMAGE_URI" '
            .containerDefinitions[0].image = $IMAGE |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
          ' taskdef.json > new-taskdef.json

          cat new-taskdef.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task-def-arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Deploy to idle ECS service
        run: |
          SLOT=${{ steps.slot.outputs.deploy-slot }}

          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "Service: svc-${SLOT}"
          echo "Task Definition: ${{ steps.task-def.outputs.task-def-arn }}"

          # Verify cluster exists
          aws ecs describe-clusters \
            --clusters "${{ env.ECS_CLUSTER }}"

          # Verify service exists
          aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "svc-${SLOT}"

          # Deploy new task definition
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "svc-${SLOT}" \
            --task-definition "${{ steps.task-def.outputs.task-def-arn }}" \
            --force-new-deployment

          echo "Waiting for svc-${SLOT} to stabilise..."

          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "svc-${SLOT}"

          echo "svc-${SLOT} is stable"

  # ─────────────────────────────────────────────────────────────
  # JOB 4 — Health check validation against green
  # ─────────────────────────────────────────────────────────────
  health-check:
    name: Health Check Validation
    runs-on: ubuntu-latest
    needs: deploy-green

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run health check script
        env:
          ALB_DNS: ${{ secrets.ALB_DNS_NAME }}
          DEPLOY_SLOT: ${{ needs.deploy-green.outputs.deploy-slot }}
          HEALTH_PATH: /health
          HEALTH_PORT: 8080
        run: |
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh

      - name: Optional — load test against green
        env:
          ALB_DNS: ${{ secrets.ALB_DNS_NAME }}
          DEPLOY_SLOT: ${{ needs.deploy-green.outputs.deploy-slot }}
        run: |
          # Install k6
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6 -y

          k6 run \
            --vus 10 \
            --duration 30s \
            --env BASE_URL="http://$ALB_DNS" \
            scripts/load-test.js

  # ─────────────────────────────────────────────────────────────
  # JOB 5 — Switch traffic to green
  # ─────────────────────────────────────────────────────────────
  switch-traffic:
    name: Switch Traffic
    runs-on: ubuntu-latest
    needs: [docker-push, deploy-green, health-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Debug secrets
        run: |
          echo "ALB_LISTENER_ARN is set: ${{ secrets.ALB_LISTENER_ARN != '' }}"
          echo "TG_BLUE_ARN is set     : ${{ secrets.TG_BLUE_ARN != '' }}"
          echo "TG_GREEN_ARN is set    : ${{ secrets.TG_GREEN_ARN != '' }}"

      - name: Switch ALB traffic
        env:
          DEPLOY_SLOT: ${{ needs.deploy-green.outputs.deploy-slot }}
          IDLE_SLOT: ${{ needs.deploy-green.outputs.idle-slot }}
          ALB_LISTENER_ARN: ${{ secrets.ALB_LISTENER_ARN }}
          TG_BLUE_ARN: ${{ secrets.TG_BLUE_ARN }}
          TG_GREEN_ARN: ${{ secrets.TG_GREEN_ARN }}
        run: ./scripts/switch-traffic.sh

      - name: Retag ECR image
        env:
          DEPLOY_SLOT: ${{ needs.deploy-green.outputs.deploy-slot }}
          IMAGE_TAG: ${{ needs.docker-push.outputs.image-tag }}
        run: |
          if [[ -z "${IMAGE_TAG}" ]]; then
            IMAGE_TAG="${{ needs.docker-push.outputs.image-uri }}"
            IMAGE_TAG="${IMAGE_TAG##*:}"
          fi

          echo "Retagging ${IMAGE_TAG} as ${DEPLOY_SLOT}"

          MANIFEST=$(aws ecr batch-get-image \
            --repository-name ${{ env.ECR_REPO }} \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'images[0].imageManifest' \
            --output text)

          aws ecr put-image \
            --repository-name ${{ env.ECR_REPO }} \
            --image-tag "${DEPLOY_SLOT}" \
            --image-manifest "${MANIFEST}"

          echo "Tagged ${IMAGE_TAG} as :${DEPLOY_SLOT}"

  # ─────────────────────────────────────────────────────────────
  # JOB 6 — Monitor post-switch and auto-rollback if alarms fire
  # ─────────────────────────────────────────────────────────────
  monitor-and-rollback:
    name: Post-Deploy Monitor (60s)
    runs-on: ubuntu-latest
    needs: [deploy-green, switch-traffic]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Watch CloudWatch alarms — rollback if triggered
        env:
          DEPLOY_SLOT: ${{ needs.deploy-green.outputs.deploy-slot }}
          IDLE_SLOT: ${{ needs.deploy-green.outputs.idle-slot }}
          WATCH_SECS: 300 # watch for 5 minutes post-switch
          POLL_SECS: 10
        run: |
          chmod +x ./scripts/rollback.sh
          ./scripts/rollback.sh

      - name: Get Terraform outputs
        id: tf_outputs
        run: |
          cd infra
          echo "TG_GREEN_ARN=$(terraform output -raw target_group_green_arn)" >> $GITHUB_OUTPUT
          echo "TG_BLUE_ARN=$(terraform output -raw target_group_blue_arn)" >> $GITHUB_OUTPUT
          echo "ALB_LISTENER_ARN=$(terraform output -raw alb_listener_arn)" >> $GITHUB_OUTPUT

      - name: Switch traffic to green
        env:
          TG_GREEN_ARN: ${{ steps.tf_outputs.outputs.TG_GREEN_ARN }}
          TG_BLUE_ARN: ${{ steps.tf_outputs.outputs.TG_BLUE_ARN }}
          ALB_LISTENER_ARN: ${{ steps.tf_outputs.outputs.ALB_LISTENER_ARN }}
          DEPLOY_SLOT: green
          IDLE_SLOT: blue
        run: |
          chmod +x ./scripts/switch-traffic.sh
          ./scripts/switch-traffic.sh
